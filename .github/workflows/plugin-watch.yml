# Clicktrough: a watch on the original. This build is frozen on the
# original's meter at clicktrough/BASE and on its plugins as the plugins repo
# pins them; nothing new comes in by itself. Every hour it reads
# taengu/A2Tools-Plugins and the meter's plugin catalog and opens an issue
# here (label plugin-watch) when a plugin came, got a new version, reached the
# catalog or is gone; and one (label original-watch) when the original
# released a meter version newer than clicktrough/BASE, with what changed.
# What it has seen is kept on the branch plugin-watch (known.json, one
# commit, replaced each time). See clicktrough/watch/plugin_watch.py.
name: Original watch

on:
  schedule:
    # Hourly: GitHub runs scheduled workflows late and drops many (every 4 to
    # 5 hours here), so more chances.
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugin-watch.yml"
      - "clicktrough/watch/plugin_watch.py"
      - "clicktrough/BASE"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGINS: https://github.com/taengu/A2Tools-Plugins.git
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: clicktrough
      - name: The original's plugins and what was seen so far
        run: |
          set -euo pipefail
          git clone -q --depth 1 "$PLUGINS" plugins-up
          git clone -q --depth 1 --branch plugin-watch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null \
            || mkdir -p state
          rm -rf state/.git
      - name: Compare
        id: watch
        run: python3 -I src/clicktrough/watch/plugin_watch.py plugins-up state out >> "$GITHUB_OUTPUT"
      - name: Open an issue
        if: steps.watch.outputs.report == 'true'
        run: |
          set -euo pipefail
          gh label create plugin-watch -R "$GITHUB_REPOSITORY" --color 8250df \
            --description "New plugins in the original" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --title "$(cat out/title.txt)" --body-file out/issue.md --label plugin-watch
      - name: The original's meter
        run: |
          set -euo pipefail
          meter=https://github.com/taengu/A2Tools-DPS-Meter.git
          base=$(sed -n '1p' src/clicktrough/BASE)
          newest=$(git ls-remote --tags --refs "$meter" 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$newest" ] || [ "$newest" = "$base" ] \
            || [ "$(printf '%s\n%s\n' "$base" "$newest" | sort -V | tail -n1)" != "$newest" ]; then
            echo "The original's newest: ${newest:-unknown}; this build: $base"
            exit 0
          fi
          gh label create original-watch -R "$GITHUB_REPOSITORY" --color 0e8a16 \
            --description "New versions of the original meter" 2>/dev/null || true
          seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --label original-watch \
            --search "in:title ${newest}" --json number --jq 'length')
          if [ "$seen" != "0" ]; then
            echo "Already reported: $newest"
            exit 0
          fi
          git clone -q --filter=blob:none --no-checkout "$meter" meter-up
          {
            echo "The original released **${newest}**. This build stays on **${base}** (\`clicktrough/BASE\`) until we decide."
            echo
            echo "Options: take nothing; take single fixes (\`clicktrough/backports\`); or move to ${newest} (\`clicktrough/BASE\`, then port the patches)."
            echo "Worth taking in any case: parser fixes after a game update, the skill/NPC/dungeon tables, security fixes."
            echo
            echo "**What changed** (${base}..${newest}):"
            git -C meter-up log --no-merges --format='- %s' "${base}..${newest}" | head -n 200
            echo
            echo "Compare: https://github.com/taengu/A2Tools-DPS-Meter/compare/${base}...${newest}"
          } > meter.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "The original released ${newest} (this build: ${base})" \
            --label original-watch --body-file meter.md
      - name: Keep what was seen
        if: steps.watch.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd state
          git init -q -b plugin-watch
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Plugin watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" plugin-watch
