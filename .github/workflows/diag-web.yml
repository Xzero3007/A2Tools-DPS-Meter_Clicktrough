name: diag-web
on:
  push:
    branches: [diag-web]
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - name: answers of the API
        run: |
          exec > >(tee -a $RUNNER_TEMP/out.txt) 2>&1
          get() { echo "== $1"; curl -sS -m 30 --retry 6 --retry-all-errors --retry-delay 10 -H "Accept: application/json" -A "A2Tools-DPS-Meter/2.0.77 Clicktrough" -w "\n[%{http_code}]\n" "https://aion2.exchange/api/$1" > $RUNNER_TEMP/r.json; head -c ${2:-1500} $RUNNER_TEMP/r.json; echo; tail -1 $RUNNER_TEMP/r.json; }
          get "servers" 600
          curl -sS -m 30 --retry 6 --retry-all-errors --retry-delay 10 https://aion2.exchange/api/servers | python3 -c 'import json,sys; d=json.load(sys.stdin); print("default", d.get("default"), "keys", sorted(d)); [print(s) for s in d["servers"] if s.get("region") in ("EU","EUW","EUE") or "EU" in str(s.get("region_name"))][:0]; print([ (s["server_id"], s["name"], s["region"], s["faction"], s["has_data"]) for s in d["servers"] if s["name"] in ("Marchutan","Siel","Israphel")])' || true
          get "items?server=12305&limit=3" 1500
          get "items?server=12305&limit=10&keys=610610013,610610014,610610015,610610016,610620001,610620002" 2500
          get "items?server=12305&limit=3&q=Odyle" 1200
          get "items?server=12305&limit=3&search=Odyle" 600
          get "items/610610013?server=12305" 800
          get "items/610610013/prices?server=12305&bucket=1d" 600
          get "health" 300
          get "crafts?server=12305&limit=2" 1200
      - name: report
        if: always()
        run: |
          body=$(sed -e 's/%/%25/g' $RUNNER_TEMP/out.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=data::$body"
